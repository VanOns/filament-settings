name: Production release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (v1.1.1, v1.1.2, etc.)'
        required: true
        type: string

env:
  PHP_VERSION: 8.2
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📄 Clone Repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: ✨ Get Composer Cache Directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer -g config cache-files-dir)"

      - name: 📦 Set up composer dependency caching
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: ⬇️ Install composer dependencies
        run: |
          composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: 📦 Branch and Commit
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git checkout -b release/${{ env.VERSION }}
          git push --set-upstream origin release/${{ env.VERSION }}
          git tag ${{ env.VERSION }}
          git push --tags -f
